<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  
  <title>HUMI - Digital Cigar Lounge</title>
  <meta name="description" content="Your private digital cigar lounge. Log, rate, and connect with fellow enthusiasts." />
  
  <meta name="theme-color" content="#8B4513" />
  <meta name="background-color" content="#ffffff" />
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HUMI" />
  <link rel="apple-touch-icon" href="/assets/images/icon.png" />
  
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="HUMI" />
  
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  
  <style>
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #8B4513;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Critical for iOS Safari - ensure full height flex layout */
    #root {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      background-color: #8B4513;
    }
    
    /* Expo web wrapper - ensure it takes full height */
    #root > div,
    #root > div > div,
    #root > div > div > div,
    [data-expo-root],
    [data-expo-root] > div {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
    }
    
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      box-sizing: border-box;
    }
    
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script>
    // Version for cache busting - update on every deploy
    var SW_VERSION = '20251230c';
    
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/service-worker.js?v=' + SW_VERSION, { updateViaCache: 'none' })
          .then(function(registration) {
            console.log('HUMI Service Worker registered:', registration.scope);
            
            // Listen for new service worker - banner will handle user prompt
            registration.addEventListener('updatefound', function() {
              var newWorker = registration.installing;
              console.log('New service worker found, installing...');
            });
          })
          .catch(function(error) {
            console.log('HUMI Service Worker registration failed:', error);
          });
      });
      
      // Listen for messages from service worker - banner will handle user prompt
      navigator.serviceWorker.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'RELOAD') {
          console.log('Update available - banner will prompt user');
          // Don't auto-reload, let the UpdateBanner component handle it
        }
      });
    }
    
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.humiInstallPrompt = deferredPrompt;
    });
  </script>
</body>
</html>
