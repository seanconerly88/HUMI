<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  
  <title>HUMI - Digital Cigar Lounge</title>
  <meta name="description" content="Your private digital cigar lounge. Log, rate, and connect with fellow enthusiasts." />
  
  <meta name="theme-color" content="#f9f9f9" />
  <meta name="background-color" content="#f9f9f9" />
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HUMI" />
  <link rel="apple-touch-icon" href="/assets/images/icon.png" />
  
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="HUMI" />
  
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  
  <style>
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      margin: 0;
      padding: 0;
      padding-bottom: env(safe-area-inset-bottom, 0);
      overflow: hidden;
      background-color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Critical for iOS Safari - ensure full height flex layout */
    #root {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }
    
    /* Expo web wrapper - ensure it takes full height */
    #root > div,
    #root > div > div,
    #root > div > div > div,
    [data-expo-root],
    [data-expo-root] > div {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
    }
    
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      box-sizing: border-box;
    }
    
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
    
    /* iOS PWA Tab Bar Safe Area Fix */
    /* Target React Navigation bottom tab bar */
    [role="tablist"] {
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px) !important;
      min-height: 70px !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script>
    console.log('HUMI app loading...');
    
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/service-worker.js')
          .then(function(registration) {
            console.log('HUMI Service Worker registered:', registration.scope);
          })
          .catch(function(error) {
            console.log('HUMI Service Worker registration failed:', error);
          });
      });
    }
    
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.humiInstallPrompt = deferredPrompt;
    });
  </script>
</body>
</html>
