<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  
  <title>HUMI - Digital Cigar Lounge</title>
  <meta name="description" content="Your private digital cigar lounge. Log, rate, and connect with fellow enthusiasts." />
  
  <meta name="theme-color" content="#f9f9f9" />
  <meta name="background-color" content="#f9f9f9" />
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HUMI" />
  <link rel="apple-touch-icon" href="/assets/images/icon.png" />
  
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="HUMI" />
  
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  
  <style>
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      body {
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
    
    /* Critical for iOS Safari - ensure full height flex layout */
    #root {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }
    
    /* Expo web wrapper - ensure it takes full height */
    #root > div,
    #root > div > div,
    #root > div > div > div,
    [data-expo-root],
    [data-expo-root] > div {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
    }
    
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      box-sizing: border-box;
    }
    
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script>
    // Version for cache busting - update on every deploy
    var APP_VERSION = '2026.01.04.02';
    var LOCAL_VERSION_KEY = 'humi_app_version';
    var RELOAD_GUARD_KEY = 'humi_reload_guard';
    
    // Prevent infinite reload loops - only allow one reload per 10 seconds
    function safeReload() {
      var lastReload = sessionStorage.getItem(RELOAD_GUARD_KEY);
      var now = Date.now();
      if (lastReload && (now - parseInt(lastReload)) < 10000) {
        console.log('Reload guard: skipping reload (too recent)');
        return false;
      }
      sessionStorage.setItem(RELOAD_GUARD_KEY, now.toString());
      console.log('Performing safe reload...');
      window.location.reload(true);
      return true;
    }
    
    // Check for version updates - runs once on load
    async function checkForUpdates() {
      try {
        var response = await fetch('/version.json?t=' + Date.now(), { 
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        });
        
        if (!response.ok) {
          console.log('Version check: Could not fetch version.json');
          return;
        }
        
        var serverVersion = await response.json();
        var localVersion = localStorage.getItem(LOCAL_VERSION_KEY);
        
        console.log('Version check: local=' + localVersion + ', server=' + serverVersion.version);
        
        // If version mismatch, clear caches and reload ONCE
        if (localVersion !== serverVersion.version) {
          console.log('Update detected! Updating version...');
          
          // Save new version FIRST to prevent loop
          localStorage.setItem(LOCAL_VERSION_KEY, serverVersion.version);
          
          // Clear all caches
          if ('caches' in window) {
            var cacheNames = await caches.keys();
            await Promise.all(cacheNames.map(function(name) {
              console.log('Deleting cache:', name);
              return caches.delete(name);
            }));
          }
          
          // Reload with guard
          safeReload();
          return;
        }
        
        console.log('App is up to date');
      } catch (e) {
        console.log('Version check error:', e);
      }
    }
    
    // Run version check immediately
    checkForUpdates();
    
    // Service worker registration - no auto-reload on controllerchange
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/service-worker.js?v=' + APP_VERSION, { updateViaCache: 'none' })
          .then(function(registration) {
            console.log('HUMI Service Worker registered:', registration.scope);
            registration.update();
          })
          .catch(function(error) {
            console.log('HUMI Service Worker registration failed:', error);
          });
      });
    }
    
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.humiInstallPrompt = deferredPrompt;
    });
  </script>
</body>
</html>
