<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  
  <title>HUMI - Digital Cigar Lounge</title>
  <meta name="description" content="Your private digital cigar lounge. Log, rate, and connect with fellow enthusiasts." />
  
  <meta name="theme-color" content="#8B4513" />
  <meta name="background-color" content="#1a1a2e" />
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HUMI" />
  <link rel="apple-touch-icon" href="/assets/images/icon.png" />
  
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="HUMI" />
  
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  
  <style>
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1a1a2e;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
    
    @supports (padding: env(safe-area-inset-top)) {
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/service-worker.js')
          .then(function(registration) {
            console.log('HUMI Service Worker registered:', registration.scope);
          })
          .catch(function(error) {
            console.log('HUMI Service Worker registration failed:', error);
          });
      });
    }
    
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.humiInstallPrompt = deferredPrompt;
    });
  </script>
</body>
</html>
