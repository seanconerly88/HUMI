  <script>
    console.log('HUMI app loading...');
    
    // Dynamic viewport height for iOS Safari (handles address bar show/hide)
    function setAppHeight() {
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty('--app-height', vh + 'px');
    }
    
    // Initial set
    setAppHeight();
    
    // Update on resize and viewport changes
    window.addEventListener('resize', setAppHeight);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setAppHeight);
    }
    
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/service-worker.js')
          .then(function(registration) {
            console.log('HUMI Service Worker registered:', registration.scope);
          })
          .catch(function(error) {
            console.log('HUMI Service Worker registration failed:', error);
          });
      });
    }
    
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.humiInstallPrompt = deferredPrompt;
    });
  </script>
